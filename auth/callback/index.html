<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in…</title>
  <meta name="theme-color" content="#1f5fae">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script>try{var t=localStorage.getItem('lbr.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
  <main class="signin">
    <div class="card signin-card" id="msg"><div class="spinner" aria-hidden="true"></div><p>Signing you in…</p></div>
  </main>
  <script type="module">
    import { handleCallback } from '../../js/auth.js';
    import { APP_BASE } from '../../js/config.js';
    handleCallback().catch((err) => {
      const box = document.getElementById('msg');
      box.innerHTML = '';
      const h = document.createElement('h1'); h.textContent = 'Sign-in failed';
      const p = document.createElement('p'); p.className = 'alert alert-error selectable'; p.textContent = err.message;
      const a = document.createElement('a'); a.href = APP_BASE; a.className = 'btn btn-primary'; a.textContent = 'Try again';
      box.append(h, p, a);
    });
  </script>
</body>
</html>
